apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog-mvc
  labels:
    app.kubernetes.io/name: product-catalog-mvc
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # never drop below desired capacity during a rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: product-catalog-mvc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-catalog-mvc
        app.kubernetes.io/component: api
    spec:
      # > preStop sleep + SHUTDOWN_GRACE_SECONDS + a margin
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: product-catalog-mvc
      containers:
        - name: app
          image: product-catalog-mvc
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: product-catalog-mvc-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: product-catalog-mvc-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-catalog-mvc-db
                  key: password
            # HS256 secret for local/k3s tokens; absent in production (issuer-based validation)
            - name: JWT_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: product-catalog-mvc-jwt
                  key: hmac-secret
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          # Startup: allow up to 2 minutes (Flyway migration, waiting for PostgreSQL).
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Give endpoints/ingress time to stop routing here before the JVM gets SIGTERM.
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

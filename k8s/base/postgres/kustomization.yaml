# In-cluster PostgreSQL for dev/test clusters (k3s). Production should use a managed
# database (e.g. Azure Database for PostgreSQL) instead: the prod overlay does not include this.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: product-catalog-mvc
    includeSelectors: false

resources:
  - statefulset.yaml
  - service.yaml
  - networkpolicy.yaml
